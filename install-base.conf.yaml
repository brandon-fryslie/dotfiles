- defaults:
    link:
      relink: true
      force: true
    clean:
      force: true

- clean: ['~']

# Standard dotfiles
- link:
    # Global dotfiles from config/
    ~/.aider.conf.yml: config/aider.conf.global.yml
    ~/.gemrc: config/gemrc.global
    ~/.config/git: config/git
    ~/.config/kitty: config/kitty
    ~/.mackup.cfg: config/mackup.global.cfg
    ~/.p10k.zsh: config/p10k.global.zsh
    ~/.rvmrc: config/rvmrc.global
    ~/.config/tmux: config/tmux
    ~/.config/tmux-powerline: config/tmux-powerline
    ~/.config/zellij: config/zellij
    ~/.config/nvim: config/nvim

- shell:
    # tmux-continuum's status-right save trigger is unreliable (see
    # config/tmux/scripts/tmux-resurrect-save.sh); own the periodic save with a
    # launchd StartInterval agent instead.
    - [chmod +x scripts/setup-tmux-resurrect-save.sh, Make resurrect-save setup executable]
    -
      command: ./scripts/setup-tmux-resurrect-save.sh
      description: Install launchd periodic tmux-resurrect save
      stdout: true
      stderr: true
