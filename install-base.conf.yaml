- defaults:
    link:
      relink: true
      force: true
    clean:
      force: true

- clean: ['~']

# Standard dotfiles
- link:
    # Global dotfiles from config/
    ~/.aider.conf.yml: config/aider.conf.global.yml
    ~/.gemrc: config/gemrc.global
    ~/.config/git: config/git
    ~/.config/kitty: config/kitty
    ~/.mackup.cfg: config/mackup.global.cfg
    ~/.p10k.zsh: config/p10k.global.zsh
    ~/.rvmrc: config/rvmrc.global
    ~/.config/tmux: config/tmux
    ~/.config/tmux-powerline: config/tmux-powerline
    ~/.config/zellij: config/zellij
    ~/.config/nvim: config/nvim
    ~/.config/certs: config/certs

- shell:
    # The stock tmux-256color terminfo lacks the RGB flag, so apps inside tmux
    # fall back to 256 colors regardless of what tmux can render.
    - [chmod +x scripts/install-terminfo.sh, Make terminfo setup executable]
    -
      command: ./scripts/install-terminfo.sh
      description: Install tmux-256color terminfo with RGB (24-bit color)
      stdout: true
      stderr: true

    # tmux-continuum's status-right save trigger is unreliable (see
    # config/tmux/scripts/tmux-resurrect-save.sh); own the periodic save with a
    # launchd StartInterval agent instead.
    - [chmod +x scripts/setup-tmux-resurrect-save.sh, Make resurrect-save setup executable]
    -
      command: ./scripts/setup-tmux-resurrect-save.sh
      description: Install launchd periodic tmux-resurrect save
      stdout: true
      stderr: true

    # SSL_CERT_FILE and REQUESTS_CA_BUNDLE *replace* the trust store (unlike
    # NODE_EXTRA_CA_CERTS, which adds to it), so they must point at a bundle that
    # is complete on its own: this machine's keychain roots plus the Proxyman CA.
    # The generator derives that bundle and renders both places the vars are set
    # -- the launchd agent for GUI apps, env.sh for shells -- from one table.
    -
      command: ./config/certs/regen-ca-bundle.py
      description: Build CA trust bundle and install local.ca-env launchd agent
      stdout: true
      stderr: true
