# A pane that ran a shell closes when it exits. Any other pane keeps its output on
# screen and gets the default command (zsh) below it, once. tmux keeps every dead pane
# so the pane-died hook can decide which. A launcher that wants plain tmux behavior
# sets `remain-on-exit off` in the command that creates the pane
# (`new-window cmd \; set -p remain-on-exit off`); set afterward, it races the exit.
# The default command marks its pane as a shell pane (scripts/tmux-shell.sh).
set -g default-command "$TMUX_CONFIG_DIR/scripts/tmux-shell.sh"
set -g remain-on-exit on
# No "Pane is dead" banner: it is painted on the bottom row, so it would be
# captured with a screenful of blank rows above it and reprinted.
set -g remain-on-exit-format ""
set-hook -g pane-died "run-shell -b '$TMUX_CONFIG_DIR/scripts/tmux-pane-respawn.sh #{pane_id}'"
