# Every dead pane is kept so the pane-died hook decides its fate: a shell pane closes;
# any other pane keeps its output on screen and gets the default command (zsh) below
# it, once. A launcher that wants plain tmux behavior sets `remain-on-exit off` on the
# pane in the same command that creates it (`new-window cmd \; set -p remain-on-exit off`);
# set afterward, it races the command's exit.
set -g remain-on-exit on
# No "Pane is dead" banner: it is painted on the bottom row, so it would be
# captured with a screenful of blank rows above it and reprinted.
set -g remain-on-exit-format ""
set-hook -g pane-died 'run-shell -b "~/.config/tmux/scripts/tmux-pane-respawn.sh #{pane_id}"'
