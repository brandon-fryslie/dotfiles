# When a pane's program exits, keep its output on screen and start the default
# command (zsh) below it. Applies to zsh itself too: `exit` respawns; kill-pane closes.
set -g remain-on-exit on
# No "Pane is dead" banner: it is painted on the bottom row, so it would be
# captured with a screenful of blank rows above it and reprinted.
set -g remain-on-exit-format ""
set-hook -g pane-died 'run-shell -b "~/.config/tmux/scripts/tmux-pane-respawn.sh #{pane_id}"'
