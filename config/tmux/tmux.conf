%hidden TMUX_CONFIG_DIR="$HOME/.config/tmux"

# Shell configuration - ensure login shells with full config
set -g default-shell "/bin/zsh"
set -g default-command "/bin/zsh -l"

# Fix terminal colors and features
# tmux-256color is tmux's own terminfo; screen-256color describes GNU screen and
# hard-caps apps at 256 colors regardless of what tmux emits outward.
set -g default-terminal "tmux-256color"
# [LAW:dataflow-not-control-flow] `*` not a TERM name: every terminal reaching this
# config (kitty, Ghostty, Blink, nested tmux) is truecolor, so RGB is an unconditional
# fact rather than a pattern match that silently no-ops under an unlisted client.
set -as terminal-features ",*:RGB"
set -g focus-events on

# Shows abbreviated action with icons
source-file $TMUX_CONFIG_DIR/conf.d/tmux-command-echo.conf

# Some awesome commands set up specifically to use with Blink + iPad
source-file $TMUX_CONFIG_DIR/conf.d/super-commands.conf

# A chart to help me remember kb shortcuts.  Bring up with prefix ?
source-file $TMUX_CONFIG_DIR/conf.d/help-chart.conf

# Configure mouse to only kinda suck on Mac (way better than default)
source-file $TMUX_CONFIG_DIR/conf.d/mac-mouse.conf

# Auto-toggle mouse mode based on pane application's mouse reporting
# source-file $TMUX_CONFIG_DIR/conf.d/auto-mouse-toggle.conf

# Set terminal title to session name (for kitty tab titles)
set -g set-titles on
set -g set-titles-string "#{session_name}"

# Start windows and panes at 1, not 0 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Status bar styling (minimal)
# Note: status-left and status-right are overridden by command-echo option
set -g status-style 'bg=black fg=white'

# Tmux Plugin Manager 
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# Auto-save tmux state.
# Continuum owns RESTORE (auto-restore on server start — render-independent).
# The periodic SAVE is owned by a launchd agent, NOT continuum's status-right
# trigger: that trigger redraws-to-save and gets clobbered by this config's
# custom status-right (conf.d/tmux-command-echo.conf) and by continuum's own
# another_tmux_server_running heuristic, so saves silently stopped. See
# config/tmux/scripts/tmux-resurrect-save.sh + scripts/setup-tmux-resurrect-save.sh.
# @continuum-save-interval is kept only to mirror the launchd StartInterval (5m).
# [LAW:single-enforcer] [LAW:no-ambient-temporal-coupling]
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
# Capture pane scrollback + in-flight output on every continuum save.
# Without this, only session/window/pane topology is persisted — pane
# contents and REPL/agent state are lost on any server restart.
set -g @resurrect-capture-pane-contents 'on'
# Restart long-running agents/REPLs inside panes on restore. Tilde prefix
# means resurrect will match the command anywhere in the pane's running
# process tree (important for claude, which runs via node).
set -g @resurrect-processes '"~claude" "~codex" "~npx claude" "~node claude" python ipython node'
# Completion signal for the iTerm2 session-restore feature (config/iterm2/restore/).
# This hook is the SOLE writer of @cwd_restore_done, set once to 1 when resurrect
# has finished restoring every session. Restored tabs only ever READ it. A set-once
# positive edge is immune to the ordering race that a clear-to-0 flag had: a late
# reader still sees 1, and there is no second writer to clobber it. The previous
# two-writer @cwd_restoring (a tab raised it, this hook cleared it) could stick at
# 1 forever when continuum restored before the tab's raise, hanging every tab for
# the full wait window. [LAW:one-source-of-truth] [LAW:no-ambient-temporal-coupling]
# @cwd_* is a runtime-only option (dies with the server), so no stale state.
set -g @resurrect-hook-post-restore-all 'tmux set -g @cwd_restore_done 1'

# Live writer for the iTerm2 restore sidecar. On attach and on every session
# switch, record the attaching client's (session, cwd) under its iTerm2 UUID, so a
# future restart has fresh truth to reconnect to. A client hook (not a shell
# precmd) is used because the outer iTerm2 shell is blocked inside `tmux attach`
# and never sees in-client switches. The writer maps #{client_tty} back to the
# iTerm2 UUID via the bridge the outer shell registered. See
# config/iterm2/restore/record-handle.zsh. [LAW:no-ambient-temporal-coupling]
set-hook -g client-attached        'run-shell -b "~/.config/iterm2/restore/record-handle.zsh \"#{client_tty}\" \"#{client_session}\" \"#{pane_current_path}\""'
set-hook -g client-session-changed 'run-shell -b "~/.config/iterm2/restore/record-handle.zsh \"#{client_tty}\" \"#{client_session}\" \"#{pane_current_path}\""'
# Note: status-right is handled by tmux-powerline (see ~/.config/tmux-powerline/themes/custom.sh)
# The tmux_continuum_status segment displays continuum info in the powerline

# Tmux Powerline
# set -g @plugin 'erikw/tmux-powerline'

# Tmux better-mouse-mode
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# Bootstrap TPM if missing
run-shell '[ ! -d ~/.config/tmux/plugins/tpm ] && git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'

run-shell '~/.config/tmux/plugins/tpm/bin/install_plugins && touch ~/.config/tmux/plugins/.last_install'

# Run tmux plugin manager
run-shell 'PATH=/opt/homebrew/bin:/opt/homebrew/sbin:/Users/bmf/.local/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin ~/.config/tmux/plugins/tpm/tpm'

# Disable aggressive-resize (tmux-sensible enables it, so this must come after TPM)
setw -g aggressive-resize off

