- defaults:
    link:
      relink: true
      force: true

- create:
    - ~/.claude
    - ~/.claude/plugins

- link:
    ~/.claude/agents: config/claude/agents
    ~/.claude/agents-disabled: config/claude/agents-disabled
    ~/.claude/commands: config/claude/commands
    ~/.claude/commands-disabled: config/claude/commands-disabled
    ~/.claude/personal-synced: config/claude/personal-synced
    ~/.claude/skills: config/claude/skills
    ~/.claude/CLAUDE.md: config/claude/CLAUDE.md
    ~/.claude/statusline-candybar: config/claude/statusline-candybar

# ~/.claude/settings.json is Claude Code's own scratch file (model, effort, plugin
# toggles) and is deliberately unmanaged. The stable baseline is linked into the
# managed-settings drop-in directory instead, which Claude Code merges at every
# launch, ranks above the user file, and never writes.
- shell:
    -
      command: DOTFILES_DIR="$PWD" ./migrations/run-migrations.sh
      description: Run pending migrations (every profile; only zshrc.home runs them at shell start)
      stdout: true
      stderr: true
    # /Library/Application Support is root-owned, so dotbot can only link into the
    # drop-in directory once it belongs to the user. This is the one root step,
    # and it asks for sudo only on a machine where that has not happened yet.
    -
      command: d="/Library/Application Support/ClaudeCode/managed-settings.d"; [ -w "$d" ] || { sudo mkdir -p "$d" && sudo chown "$USER" "$d"; }
      description: Make the Claude Code managed-settings drop-in directory user-writable (sudo once per machine)
      stdin: true
      stdout: true
      stderr: true

- link:
    "/Library/Application Support/ClaudeCode/managed-settings.d/10-dotfiles.json": config/claude/settings.managed.json

- create:
    - ~/.gemini
    - ~/.copilot
    - ~/.copilot/skills
    - ~/.codex
    - ~/.agents
    - ~/.agents/skills

- link:
    ~/.gemini/GEMINI.md: config/gemini/GEMINI.md
    ~/.gemini/skills: config/gemini/skills
    ~/.copilot/copilot-instructions.md: config/copilot/copilot-instructions.md
    ~/.copilot/skills/claude-plugin-sync: config/copilot/skills/claude-plugin-sync
    ~/.codex/skills: config/codex/skills
    ~/.agents/skills:
      path: config/agents/skills/*
      glob: true
      relink: true
      force: true
