- defaults:
    link:
      relink: true
      force: true

- create:
    - ~/.claude
    - ~/.claude/plugins

- link:
    ~/.claude/agents: config/claude/agents
    ~/.claude/agents-disabled: config/claude/agents-disabled
    ~/.claude/commands: config/claude/commands
    ~/.claude/commands-disabled: config/claude/commands-disabled
    ~/.claude/personal-synced: config/claude/personal-synced
    ~/.claude/skills: config/claude/skills
    ~/.claude/CLAUDE.md: config/claude/CLAUDE.md
    ~/.claude/statusline-candybar: config/claude/statusline-candybar

# ~/.claude/settings.json is Claude Code's own scratch file (model, effort, plugin
# toggles) and is deliberately unmanaged. The stable baseline is deployed to the
# managed-settings path instead, which Claude Code reads but never rewrites.
- shell:
    -
      command: DOTFILES_DIR="$PWD" ./migrations/run-migrations.sh
      description: Run pending migrations (every profile; only zshrc.home runs them at shell start)
      stdout: true
      stderr: true
    -
      command: ./scripts/install-claude-managed-settings.sh
      description: Link Claude Code managed settings baseline into managed-settings.d (sudo when the link changed)
      stdin: true
      stdout: true
      stderr: true

- create:
    - ~/.gemini
    - ~/.copilot
    - ~/.copilot/skills
    - ~/.codex
    - ~/.agents
    - ~/.agents/skills

- link:
    ~/.gemini/GEMINI.md: config/gemini/GEMINI.md
    ~/.gemini/skills: config/gemini/skills
    ~/.copilot/copilot-instructions.md: config/copilot/copilot-instructions.md
    ~/.copilot/skills/claude-plugin-sync: config/copilot/skills/claude-plugin-sync
    ~/.codex/skills: config/codex/skills
    ~/.agents/skills:
      path: config/agents/skills/*
      glob: true
      relink: true
      force: true
